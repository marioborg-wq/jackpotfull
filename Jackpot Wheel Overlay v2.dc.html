<style>
  @font-face {
    font-family: "NN Swinton STD";
    src: url("fonts/NNSwintonSTD-HeavyItalic.woff") format("woff");
    font-weight: 900;
    font-style: italic;
    font-display: swap;
  }
  a { color: #00DD70; text-decoration: none; }
  a:hover { color: #00C264; text-decoration: underline; }
  @keyframes jw-spin { to { transform: rotate(360deg); } }
  @keyframes jw-fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes jw-flicker {
    0%   { transform: translate(-50%, -50%) scale(1, 1);       opacity: 0.82; }
    22%  { transform: translate(-50%, -51%) scale(1.06, 1.1);  opacity: 1; }
    41%  { transform: translate(-50%, -49%) scale(0.95, 1.04); opacity: 0.7; }
    63%  { transform: translate(-50%, -52%) scale(1.08, 1.14); opacity: 0.95; }
    81%  { transform: translate(-50%, -50%) scale(0.98, 1.02); opacity: 0.78; }
    100% { transform: translate(-50%, -50%) scale(1, 1);       opacity: 0.82; }
  }
  @keyframes jw-flame-idle-spin { to { transform: rotate(360deg); } }
  @keyframes jw-flame-heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.14); }
    24% { transform: scale(1); }
    36% { transform: scale(1.1); }
    48% { transform: scale(1); }
  }
  @keyframes jw-label-win {
    0%, 100% { opacity: 1; transform: var(--jw-label-base) scale(1); }
    15% { opacity: 0.25; transform: var(--jw-label-base) scale(1.22); }
    30% { opacity: 1; transform: var(--jw-label-base) scale(1.22); }
    45% { opacity: 0.25; transform: var(--jw-label-base) scale(1.3); }
    60% { opacity: 1; transform: var(--jw-label-base) scale(1.3); }
    80% { opacity: 1; transform: var(--jw-label-base) scale(1.12); }
  }
  @keyframes jw-weld-spark {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--wx), var(--wy)) scale(0.15); opacity: 0; }
  }
  @keyframes jw-ember {
    0%   { transform: translate(0, 0) scale(1); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translate(var(--dx), -132px) scale(0.2); opacity: 0; }
  }
  @keyframes jw-idle-bob {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-5px); }
  }
  @keyframes jw-title-levitate {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-6px); }
  }
  @keyframes jw-title-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.07); }
  }
  @keyframes jw-spark-twinkle {
    0%, 100% { opacity: 0.15; transform: scale(0.5); }
    50%      { opacity: 1;    transform: scale(1.3); }
  }
  @keyframes jw-halo {
    0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.6;  transform: translate(-50%, -50%) scale(1.08); }
  }
  @keyframes jw-coin-fall {
    0%   { transform: translate(0, -60px) rotate(0deg); opacity: 0; }
    8%   { opacity: 1; }
    100% { transform: translate(var(--drift), 900px) rotate(var(--spin)); opacity: 0.95; }
  }
  @keyframes jw-title-pop {
    0%   { transform: scale(0.4); opacity: 0; }
    55%  { transform: scale(1.18); opacity: 1; }
    75%  { transform: scale(0.94); }
    90%  { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  @keyframes jw-shine {
    0%   { background-position: 200% 0; }
    100% { background-position: -100% 0; }
  }
  @keyframes jw-win-flash {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.4); }
    12%  { opacity: 1; transform: translate(-50%, -50%) scale(1.5); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2.4); }
  }
</style>

<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;winningTier&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Mini Jackpot&quot;,&quot;Minor Jackpot&quot;,&quot;Major Jackpot&quot;,&quot;Mega Jackpot&quot;],&quot;default&quot;:&quot;Mega Jackpot&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Outcome&quot;},&quot;stopStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Clean&quot;,&quot;Near-miss&quot;,&quot;Slow-motion tick&quot;],&quot;default&quot;:&quot;Clean&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;spinDuration&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:3200,&quot;max&quot;:9000,&quot;step&quot;:200,&quot;default&quot;:5400,&quot;unit&quot;:&quot;ms&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;autoSpin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Outcome&quot;}}">
const SECTOR_WIDTH = 22.5;
const SECTORS = [
  { key: "mini" }, { key: "mega" }, { key: "mini" }, { key: "nowin" },
  { key: "major" }, { key: "minor" }, { key: "major" }, { key: "minor" },
  { key: "mini" }, { key: "mega" }, { key: "mini" }, { key: "nowin" },
  { key: "major" }, { key: "minor" }, { key: "major" }, { key: "minor" }
].map((s, i) => ({ ...s, angle: i * SECTOR_WIDTH + SECTOR_WIDTH / 2 }));
const TIER_INFO = {
  mini:  { name: "Mini Jackpot",  amount: "R$ 1.956",     chest: "skin/icon_mini.png",  scale: 0.84, fire: 0.26, fireSize: 150, halo: 0.2 },
  minor: { name: "Minor Jackpot", amount: "R$ 51.956",    chest: "skin/icon_minor.png", scale: 0.95, fire: 0.48, fireSize: 190, halo: 0.4 },
  major: { name: "Major Jackpot", amount: "R$ 851.956",   chest: "skin/icon_major.png", scale: 1.06, fire: 0.7,  fireSize: 232, halo: 0.6 },
  mega:  { name: "Mega Jackpot",  amount: "R$ 1.851.956", chest: "skin/icon_super.png", scale: 1.24, fire: 1.0,  fireSize: 300, halo: 1.0 },
  nowin: { name: "No Win",        amount: "",              chest: "skin/icon_default.png", scale: 0.8, fire: 0, fireSize: 150, halo: 0 }
};
const SECTOR_WEIGHTS = { mini: 90, minor: 10, major: 9, mega: 1 };
const CLOSED = "skin/icon_default.png";
const IDLE_ROT = 45;

class Component extends DCLogic {
  ringRef = React.createRef();
  chestRef = React.createRef();
  chestImgRef = React.createRef();
  fireRef = React.createRef();
  haloRef = React.createRef();
  sparksRef = React.createRef();
  flameRingRef = React.createRef();
  flameRingRotRef = React.createRef();
  weldSparksRef = React.createRef();
  winFlashRef = React.createRef();
  topContentRef = React.createRef();
  winMessageRef = React.createRef();
  winAmountRef = React.createRef();
  winTitleRef = React.createRef();
  coinRainRef = React.createRef();
  coinsSoundRef = React.createRef();
  reelSpinRef = React.createRef();
  winLogoRef = React.createRef();
  embersRef = React.createRef();
  pointerWrapRef = React.createRef();
  wheelGroupRef = React.createRef();
  grandRowRef = React.createRef();
  pillMajorRef = React.createRef();
  pillMinorRef = React.createRef();
  pillMiniRef = React.createRef();
  countdownRef = React.createRef();
  countdownNumRef = React.createRef();
  rootRef = React.createRef();
  phoneRef = React.createRef();
  preloaderRef = React.createRef();
  preloaderTextRef = React.createRef();
  countdownAudioRef = React.createRef();

  randomSpin = () => {
    if (!this.assetsReady || this.phase === "spinning" || this.phase === "countdown") return;
    this.target = this.weightedRandomSector();
    this.spin();
  };

  weightedRandomSector() {
    const total = Object.values(SECTOR_WEIGHTS).reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    let key = "mini";
    for (const k of Object.keys(SECTOR_WEIGHTS)) {
      if (r < SECTOR_WEIGHTS[k]) { key = k; break; }
      r -= SECTOR_WEIGHTS[k];
    }
    const candidates = SECTORS.map((s, i) => i).filter(i => SECTORS[i].key === key);
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  componentDidMount() {
    this.rot = 0;
    this.phase = "idle";
    this.sector = -1;
    this.target = this.tierIndex(this.props.winningTier);
    this.applyIdle();

    this.rescale = () => {
      const root = this.rootRef.current, phone = this.phoneRef.current;
      if (!root || !phone) return;
      const w = root.clientWidth || 393;
      const scale = w / 393;
      phone.style.transform = "scale(" + scale + ")";
      phone.style.left = "0px";
      phone.style.top = "0px";
    };
    this.rescale();
    if (window.ResizeObserver && this.rootRef.current) {
      this._ro = new ResizeObserver(this.rescale);
      this._ro.observe(this.rootRef.current);
    } else {
      window.addEventListener("resize", this.rescale);
    }

    this.mountTime = performance.now();
    this.assetsReady = false;
    this.preloadAssets(() => {
      this.assetsReady = true;
      if (window.__jwAudioUnlocked) {
        this.unlockAllAudio();
      }
      this.unlockAudio = () => { this.unlockAllAudio(); };
      window.addEventListener("pointerdown", this.unlockAudio, { once: true });
      const elapsed = performance.now() - this.mountTime;
      this.autoTimer = setTimeout(() => this.randomSpin(), Math.max(0, 4000 - elapsed));
    });
  }

  preloadAssets(done) {
    const images = [
      "skin/wheel-base-v2.png", "skin/wheel-frame.png", "skin/marker.png", "skin/ring-of-fire.png",
      "skin/icon_default.png", "skin/icon_mini.png", "skin/icon_minor.png", "skin/icon_major.png", "skin/icon_super.png",
      "skin/image-88.png",
      "assets/coin0.png", "assets/coin1.png", "assets/coin2.png", "assets/coin3.png",
      "assets/coin5.png", "assets/coin6.png", "assets/coin7.png", "assets/coin8.png", "assets/coin9.png", "assets/coin10.png"
    ];
    const audios = ["audio/countdown-sine-wave-beeps.mp3", "audio/coins-drop.wav", "audio/reel-spin.wav"];
    const total = images.length + audios.length;
    let loaded = 0;
    const bump = () => {
      loaded++;
      const pct = Math.round((loaded / total) * 100);
      if (this.preloaderTextRef.current) this.preloaderTextRef.current.textContent = "Loading… " + pct + "%";
      if (loaded >= total) {
        const el = this.preloaderRef.current;
        if (el) {
          el.style.opacity = "0";
          el.style.pointerEvents = "none";
          setTimeout(() => { el.style.display = "none"; }, 400);
        }
        done();
      }
    };
    images.forEach(src => {
      const img = new Image();
      img.onload = bump;
      img.onerror = bump;
      img.src = src;
    });
    audios.forEach(src => {
      const a = new Audio();
      const finish = () => { a.oncanplaythrough = null; a.onerror = null; bump(); };
      a.oncanplaythrough = finish;
      a.onerror = finish;
      a.src = src;
      a.load();
    });
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.autoTimer);
    clearTimeout(this.flameFadeTimer);
    clearInterval(this.flameFlickerTimer);
    clearTimeout(this.burstTimer);
    clearTimeout(this.winFireTimer);
    clearTimeout(this.winLoopTimer);
    clearInterval(this.coinRainInterval);
    clearTimeout(this.coinsSoundTimer);
    this.stopReelSpinSound();
    clearInterval(this.countdownTimer);
    window.removeEventListener("pointerdown", this.unlockAudio);
    window.removeEventListener("resize", this.rescale);
    if (this._ro) this._ro.disconnect();
  }

  tierIndex(name) {
    const key = Object.keys(TIER_INFO).find(k => TIER_INFO[k].name === name || k === name) || "mega";
    const i = SECTORS.findIndex(s => s.key === key);
    return i < 0 ? 0 : i;
  }

  labelEls() {
    return this.ringRef.current ? Array.from(this.ringRef.current.querySelectorAll(".jw-label")) : [];
  }

  applyIdle() {
    clearTimeout(this.flameFadeTimer);
    this._flameFading = false;
    this.stopReelSpinSound();
    clearInterval(this.countdownTimer);
    clearTimeout(this.winLoopTimer);
    this.stopCountdownSound();
    this.hideWinMessage();
    this.clearCoinRain();
    if (this.countdownRef.current) this.countdownRef.current.style.opacity = "0";
    const img = this.chestImgRef.current;
    const chest = this.chestRef.current;
    if (img) img.src = CLOSED;
    if (chest) {
      chest.style.transition = "transform 260ms cubic-bezier(0.2,0,0,1)";
      chest.style.transform = "scale(0.92)";
      chest.style.animation = "jw-idle-bob 2600ms ease-in-out infinite";
    }
    this.setFire(0, 160);
    this.setHalo(0);
    if (this.embersRef.current) this.embersRef.current.style.opacity = "0";
    if (this.sparksRef.current) this.sparksRef.current.style.opacity = "0";
    if (this.flameRingRef.current) {
      this.flameRingRef.current.style.opacity = "0.4";
      this.flameRingRef.current.style.transform = "";
      this.flameRingRef.current.style.animation = "none";
    }
    clearInterval(this.flameFlickerTimer);
    this.flameFlickerTimer = setInterval(() => {
      if (this.flameRingRef.current) {
        this.flameRingRef.current.style.opacity = (0.22 + Math.random() * 0.35).toFixed(2);
      }
    }, 260);
    if (this.weldSparksRef.current) this.weldSparksRef.current.style.opacity = "0";
    if (this.ringRef.current) {
      this.ringRef.current.style.filter = "none";
      this.ringRef.current.style.opacity = "1";
      this.ringRef.current.style.transform = "rotate(" + IDLE_ROT + "deg)";
    }
    if (this.pointerWrapRef.current) {
      this.pointerWrapRef.current.style.transition = "opacity 320ms cubic-bezier(0.2,0,0,1)";
      this.pointerWrapRef.current.style.opacity = "1";
    }
    this.setGroup(true);
    this.clearHighlights();
    this.labelEls().forEach(el => { el.style.opacity = "1"; });
  }

  setFire(intensity, size) {
    const el = this.fireRef.current;
    if (!el) return;
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.opacity = String(intensity);
    el.style.animationDuration = (1200 - 380 * intensity) + "ms";
  }

  setHalo(v) {
    const el = this.haloRef.current;
    if (!el) return;
    el.style.transition = "opacity 420ms cubic-bezier(0.2,0,0,1)";
    el.style.opacity = String(v * 0.9);
    el.style.animation = v > 0 ? "jw-halo 2400ms ease-in-out infinite" : "none";
  }

  setGroup() {}

  clearHighlights() {
    [this.pillMajorRef, this.pillMinorRef, this.pillMiniRef].forEach(r => {
      if (r.current) {
        r.current.style.transition = "background 220ms cubic-bezier(0.2,0,0,1), box-shadow 220ms cubic-bezier(0.2,0,0,1)";
        r.current.style.background = "rgba(255,255,255,0.1)";
        r.current.style.boxShadow = "none";
      }
    });
    if (this.grandRowRef.current) {
      this.grandRowRef.current.style.transition = "background 220ms cubic-bezier(0.2,0,0,1)";
      this.grandRowRef.current.style.background = "transparent";
    }
  }

  highlightTier(key) {
    this.clearHighlights();
    if (key === "mega") return;
    const r = { major: this.pillMajorRef, minor: this.pillMinorRef, mini: this.pillMiniRef }[key];
    if (r && r.current) {
      r.current.style.background = "rgba(250,215,73,0.16)";
      r.current.style.boxShadow = "inset 0 0 0 1px rgba(250,215,73,0.55)";
    }
  }

  applySector(i, burst) {
    if (i === this.sector && !burst) return;
    this.sector = i;
    const t = TIER_INFO[SECTORS[i].key];
    const img = this.chestImgRef.current;
    const chest = this.chestRef.current;
    if (img) img.src = t.chest;
    if (chest) {
      chest.style.animation = "none";
      if (burst) {
        clearTimeout(this.burstTimer);
        const s = t.scale;
        const steps = [
          [80,  s * 0.78],
          [190, s * 1.4],
          [140, s * 0.88],
          [150, s * 1.18],
          [150, s * 0.94],
          [140, s * 1.06],
          [160, s]
        ];
        let elapsed = 0;
        steps.forEach(([dur, scale], idx) => {
          elapsed += idx === 0 ? 0 : steps[idx - 1][0];
          setTimeout(() => {
            if (!chest) return;
            chest.style.transition = "transform " + dur + "ms cubic-bezier(0.34,1.56,0.64,1)";
            chest.style.transform = "scale(" + scale.toFixed(3) + ")";
          }, elapsed);
        });
      } else {
        chest.style.transition = "transform 90ms cubic-bezier(0.2,0,0,1)";
        chest.style.transform = "scale(" + t.scale + ")";
      }
    }
    this.setFire(t.fire, t.fireSize);
    if (this.embersRef.current) this.embersRef.current.style.opacity = String(0.4 + 0.6 * t.fire);
  }

  showWinMessage(t) {
    if (this.topContentRef.current) {
      this.topContentRef.current.style.opacity = "0";
      this.topContentRef.current.style.pointerEvents = "none";
    }
    if (this.winMessageRef.current) {
      this.winMessageRef.current.style.opacity = "1";
      this.winMessageRef.current.style.pointerEvents = "auto";
    }
    if (this.winTitleRef.current) {
      const title = this.winTitleRef.current;
      title.textContent = t.name;
      title.style.animation = "none";
      void title.offsetWidth;
      title.style.animation = "jw-title-pop 620ms cubic-bezier(0.2,0,0,1), jw-shine 2400ms linear infinite 620ms";
    }
    this.buildFlipAmount(t.amount);
  }

  hideWinMessage() {
    if (this.topContentRef.current) {
      this.topContentRef.current.style.opacity = "1";
      this.topContentRef.current.style.pointerEvents = "auto";
    }
    if (this.winMessageRef.current) {
      this.winMessageRef.current.style.opacity = "0";
      this.winMessageRef.current.style.pointerEvents = "none";
    }
  }

  buildFlipAmount(amount) {
    const host = this.winAmountRef.current;
    if (!host) return;
    host.innerHTML = "";
    const H = 40;
    const chars = amount.split("");
    const loops = 4;
    chars.forEach((ch, i) => {
      if (/[0-9]/.test(ch)) {
        const digit = parseInt(ch, 10);
        const landIndex = (loops - 1) * 10 + digit;
        const reelWrap = document.createElement("span");
        reelWrap.style.cssText = "display:inline-block;overflow:hidden;height:" + H + "px;width:22px;vertical-align:top;position:relative;";
        const reel = document.createElement("span");
        const dur = 1500 + i * 90;
        const delay = i * 110;
        reel.style.cssText = "display:block;transform:translateY(0px);transition:transform " + dur + "ms steps(" + landIndex + ") " + delay + "ms;";
        const sequence = [];
        for (let l = 0; l < loops; l++) for (let d = 0; d <= 9; d++) sequence.push(d);
        sequence.forEach(d => {
          const cell = document.createElement("span");
          cell.textContent = String(d);
          cell.style.cssText = "display:block;height:" + H + "px;line-height:" + H + "px;font-family:Inter, sans-serif;font-weight:700;font-size:32px;color:#FAD749;text-align:center;letter-spacing:-0.5px;";
          reel.appendChild(cell);
        });
        reelWrap.appendChild(reel);
        host.appendChild(reelWrap);
        requestAnimationFrame(() => {
          reel.style.transform = "translateY(-" + (landIndex * H) + "px)";
        });
      } else {
        const span = document.createElement("span");
        span.textContent = ch === " " ? "\u00A0" : ch;
        span.style.cssText = "display:inline-block;height:" + H + "px;line-height:" + H + "px;font-family:Inter, sans-serif;font-weight:700;font-size:32px;color:#FAD749;letter-spacing:-0.5px;";
        host.appendChild(span);
      }
    });
  }

  spawnCoinBatch(count) {
    const host = this.coinRainRef.current;
    if (!host) return;
    const coins = ["coin0","coin1","coin2","coin3","coin5","coin6","coin7","coin8","coin9","coin10"];
    for (let i = 0; i < count; i++) {
      const img = document.createElement("img");
      img.src = "assets/" + coins[Math.floor(Math.random() * coins.length)] + ".png";
      const size = 22 + Math.random() * 22;
      const left = Math.random() * 393;
      const drift = (Math.random() - 0.5) * 120;
      const spin = (Math.random() > 0.5 ? 1 : -1) * (360 + Math.random() * 540);
      const duration = 1300 + Math.random() * 900;
      const delay = Math.random() * 300;
      img.style.cssText = "position:absolute;left:" + left + "px;top:-40px;width:" + size + "px;height:" + size + "px;object-fit:contain;--drift:" + drift.toFixed(0) + "px;--spin:" + spin.toFixed(0) + "deg;animation:jw-coin-fall " + duration.toFixed(0) + "ms cubic-bezier(0.3,0.1,0.6,1) " + delay.toFixed(0) + "ms forwards;filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4));";
      host.appendChild(img);
      setTimeout(() => { if (img.parentNode) img.parentNode.removeChild(img); }, duration + delay + 200);
    }
  }

  spawnCoinRain(intensity) {
    const perBatch = Math.round(5 + intensity * 5);
    this.spawnCoinBatch(perBatch * 2);
    this.playCoinsSound();
    clearInterval(this.coinRainInterval);
    let elapsed = 0;
    this.coinRainInterval = setInterval(() => {
      elapsed += 350;
      this.spawnCoinBatch(perBatch);
      if (elapsed >= 5000) clearInterval(this.coinRainInterval);
    }, 350);
    clearTimeout(this.coinsSoundTimer);
    this.coinsSoundTimer = setTimeout(() => this.stopCoinsSound(), 7800);
  }

  playReelSpinSound() {
    const el = this.reelSpinRef.current;
    if (!el || this.musicMuted) return;
    el.loop = true;
    el.volume = 0.7;
    el.currentTime = 0;
    el.play().catch(() => {});
  }

  stopReelSpinSound() {
    const el = this.reelSpinRef.current;
    if (el) { el.pause(); el.currentTime = 0; }
  }

  unlockAllAudio() {
    [this.coinsSoundRef, this.reelSpinRef, this.countdownAudioRef].forEach(ref => {
      const el = ref.current;
      if (!el) return;
      const prevVolume = el.volume;
      el.volume = 0;
      el.play().then(() => {
        setTimeout(() => {
          el.pause();
          el.currentTime = 0;
          el.volume = prevVolume;
        }, 50);
      }).catch(() => { el.volume = prevVolume; });
    });
  }

  playCoinsSound() {
    const el = this.coinsSoundRef.current;
    if (!el || this.musicMuted) return;
    el.volume = 0.6;
    el.currentTime = 0;
    el.play().catch(() => {});
  }

  stopCoinsSound() {
    const el = this.coinsSoundRef.current;
    if (el) { el.pause(); el.currentTime = 0; }
  }

  clearCoinRain() {
    clearInterval(this.coinRainInterval);
    clearTimeout(this.coinsSoundTimer);
    this.stopCoinsSound();
    if (this.coinRainRef.current) this.coinRainRef.current.innerHTML = "";
  }

  playWinBurst(t) {
    const flash = this.winFlashRef.current;
    if (flash) {
      flash.style.animation = "none";
      void flash.offsetWidth;
      flash.style.animation = "jw-win-flash 700ms cubic-bezier(0.2,0,0,1) forwards";
    }
    this.setFire(Math.min(1.4, t.fire * 1.5), t.fireSize * 1.25);
    clearTimeout(this.winFireTimer);
    this.winFireTimer = setTimeout(() => this.setFire(t.fire, t.fireSize), 520);
  }

  playCountdownSound() {
    if (true) return;
    const el = this.countdownAudioRef.current;
    if (!el || this.musicMuted) return;
    el.volume = 0.8;
    el.currentTime = 0;
    el.play().catch(() => {});
  }

  stopCountdownSound() {
    const el = this.countdownAudioRef.current;
    if (!el) return;
    el.pause();
    el.currentTime = 0;
  }

  spin() {
    if (!this.assetsReady || this.phase === "spinning" || this.phase === "countdown") return;
    if (this.phase !== "idle") this.applyIdle();
    clearTimeout(this.autoTimer);
    this.phase = "countdown";
    let n = 3;
    if (this.countdownNumRef.current) this.countdownNumRef.current.textContent = String(n);
    if (this.countdownRef.current) {
      this.countdownRef.current.style.transition = "opacity 200ms cubic-bezier(0.2,0,0,1)";
      this.countdownRef.current.style.opacity = "1";
    }
    this.playCountdownSound();
    clearInterval(this.countdownTimer);
    this.countdownTimer = setInterval(() => {
      n -= 1;
      if (n <= 0) {
        clearInterval(this.countdownTimer);
        if (this.countdownRef.current) this.countdownRef.current.style.opacity = "0";
        this.runSpin();
        return;
      }
      if (this.countdownNumRef.current) this.countdownNumRef.current.textContent = String(n);
    }, 1000);
  }

  runSpin() {
    this.phase = "spinning";
    this.sector = -1;
    this.setGroup(false);
    this.clearHighlights();
    this.setHalo(0);

    const img = this.chestImgRef.current;
    const chest = this.chestRef.current;
    if (img) img.src = CLOSED;
    if (chest) {
      chest.style.animation = "none";
      chest.style.transition = "transform 200ms cubic-bezier(0.2,0,0,1)";
      chest.style.transform = "scale(0.9)";
    }
    this.setFire(0, 150);
    if (this.embersRef.current) this.embersRef.current.style.opacity = "0";
    if (this.flameRingRef.current) {
      this.flameRingRef.current.style.animation = "none";
    }
    if (this.flameRingRotRef.current) this.flameRingRotRef.current.style.animation = "none";
    clearInterval(this.flameFlickerTimer);
    if (this.weldSparksRef.current) this.weldSparksRef.current.style.opacity = "0.6";
    if (this.pointerWrapRef.current) this.pointerWrapRef.current.style.opacity = "1";
    this.labelEls().forEach(el => { el.style.transition = "opacity 300ms cubic-bezier(0.2,0,0,1)"; el.style.opacity = "1"; });

    const style = this.props.stopStyle || "Clean";
    const total = Math.max(3200, Number(this.props.spinDuration) || 5400);
    clearTimeout(this.winLoopTimer);
    const wMax = 1280;
    const tUp = 520;
    const tSettle = 620;
    const rest = total - tUp - tSettle;
    const tCruise = Math.round(rest * 0.34);
    const tDecel = rest - tCruise;
    const tail = style === "Slow-motion tick" ? 64 : style === "Near-miss" ? SECTOR_WIDTH * 3 + 6 : 0;
    const tTail = tail === 0 ? 0 : Math.round(tDecel * (style === "Slow-motion tick" ? 0.4 : 0.26));
    const tMain = tDecel - tTail;

    const start = IDLE_ROT;
    const aUp = 0.5 * wMax * (tUp / 1000);
    const aCruise = wMax * (tCruise / 1000);
    const theta = (360 - SECTORS[this.target].angle) % 360;
    const guess = aUp + aCruise + wMax * (tMain / 1000) / 3.1;
    const turns = Math.max(3, Math.round((guess - theta) / 360));
    const totalAngle = 360 * turns + theta;
    const aDecel = (totalAngle - start) - aUp - aCruise;
    const aMain = Math.max(120, aDecel - tail);

    this.segs = [
      { d: tUp,     a: aUp,     from: start,                     e: p => p * p },
      { d: tCruise, a: aCruise, from: start + aUp,                e: p => p },
      { d: tMain,   a: aMain,   from: start + aUp + aCruise,      e: p => 1 - Math.pow(1 - p, 2.2) },
      { d: tTail,   a: tail,    from: start + aUp + aCruise + aMain, e: p => 1 - Math.pow(1 - p, 1.5) },
      { d: tSettle, a: 0,       from: totalAngle,                e: p => p, wobble: true }
    ].filter(s => s.d > 0);

    this.t0 = performance.now();
    this.totalAngle = totalAngle;
    this.playReelSpinSound();
    clearTimeout(this.flameFadeTimer);
    this._flameFading = false;
    this.flameFadeTimer = setTimeout(() => {
      this._flameFading = true;
      if (this.flameRingRef.current) this.flameRingRef.current.style.opacity = "0";
      if (this.weldSparksRef.current) this.weldSparksRef.current.style.opacity = "0";
    }, Math.max(0, total - 1000));
    cancelAnimationFrame(this.raf);
    this.tick();
  }

  tick = () => {
    const now = performance.now();
    let el = now - this.t0;
    let angle = this.totalAngle;
    let omega = 0;
    let done = true;

    for (let i = 0; i < this.segs.length; i++) {
      const s = this.segs[i];
      if (el < s.d) {
        const p = el / s.d;
        if (s.wobble) {
          angle = this.totalAngle + 4.2 * Math.exp(-el / 150) * Math.cos(el / 52);
          omega = 0;
        } else {
          angle = s.from + s.a * s.e(p);
          const pn = Math.min(1, p + 0.008);
          omega = (s.a * (s.e(pn) - s.e(p))) / (0.008 * s.d / 1000);
        }
        done = false;
        break;
      }
      el -= s.d;
    }

    this.rot = angle;
    if (this.ringRef.current) {
      this.ringRef.current.style.transform = "rotate(" + angle + "deg)";
      const b = omega > 900 ? Math.min(2.4, (omega - 900) / 260) : 0;
      this.ringRef.current.style.filter = b > 0.05 ? "blur(" + b.toFixed(2) + "px)" : "none";
    }
    if (this.flameRingRef.current) {
      const pulseAmp = 0.12 * Math.max(0, Math.min(1, omega / 700));
      const pulse = 1 + pulseAmp * Math.sin(now / 140);
      this.flameRingRef.current.style.transform = "rotate(" + angle + "deg) scale(" + pulse.toFixed(3) + ")";
    }
    if (this.sparksRef.current) {
      const intensity = Math.max(0, Math.min(1, (omega - 150) / 1500));
      this.sparksRef.current.style.opacity = String(intensity);
    }
    if (this.flameRingRef.current && !this._flameFading) {
      const flameIntensity = Math.max(0.4, Math.min(1, (omega - 100) / 1200));
      this.flameRingRef.current.style.opacity = String(flameIntensity);
    }
    if (this.weldSparksRef.current && !this._flameFading) {
      const weldIntensity = Math.max(0.35, Math.min(1, (omega - 100) / 1400));
      this.weldSparksRef.current.style.opacity = String(weldIntensity);
    }

    if (!done) {
      if (omega > 620) {
        if (this.sector !== -1) {
          this.sector = -1;
          if (this.chestImgRef.current) this.chestImgRef.current.src = CLOSED;
          this.setFire(0, 150);
        }
        const chest = this.chestRef.current;
        if (chest) {
          const j = Math.sin(now / 34) * Math.min(2.6, omega / 480);
          chest.style.transition = "none";
          chest.style.transform = "scale(0.9) translate(" + j.toFixed(2) + "px, " + (j * 0.4).toFixed(2) + "px)";
        }
      } else {
        const idx = ((Math.floor(((360 - angle) % 360 + 360) % 360 / SECTOR_WIDTH) % SECTORS.length) + SECTORS.length) % SECTORS.length;
        this.applySector(idx);
      }
      this.raf = requestAnimationFrame(this.tick);
      return;
    }

    this.land();
  };

  land() {
    this.phase = "result";
    this.stopReelSpinSound();
    if (this.ringRef.current) {
      this.ringRef.current.style.transform = "rotate(" + this.totalAngle + "deg)";
      this.ringRef.current.style.filter = "none";
    }
    if (this.flameRingRef.current) this.flameRingRef.current.style.transform = "rotate(" + this.totalAngle + "deg)";
    if (this.sparksRef.current) this.sparksRef.current.style.opacity = "0";
    if (this.flameRingRef.current) this.flameRingRef.current.style.opacity = "0";
    if (this.weldSparksRef.current) this.weldSparksRef.current.style.opacity = "0";
    const key = SECTORS[this.target].key;
    const t = TIER_INFO[key];
    this.setGroup(true);
    this.applySector(this.target, true);
    this.setHalo(t.halo);
    this.highlightTier(key);
    this.playWinBurst(t);
    this.showWinMessage(t);
    this.spawnCoinRain(t.fire);

    this.labelEls().forEach(el => {
      const won = Number(el.dataset.idx) === this.target;
      if (won) {
        if (!el.dataset.baseTransform) el.dataset.baseTransform = el.style.transform;
        el.style.setProperty("--jw-label-base", el.dataset.baseTransform);
        el.style.transition = "none";
        el.style.animation = "jw-label-win 1100ms ease-in-out 2";
      } else {
        el.style.transition = "opacity 460ms cubic-bezier(0.2,0,0,1)";
        el.style.opacity = "0.18";
      }
    });
  }

  renderVals() {
    return {
      rootRef: this.rootRef,
      ringRef: this.ringRef,
      phoneRef: this.phoneRef,
      chestRef: this.chestRef,
      chestImgRef: this.chestImgRef,
      fireRef: this.fireRef,
      haloRef: this.haloRef,
      sparksRef: this.sparksRef,
      flameRingRef: this.flameRingRef,
      weldSparksRef: this.weldSparksRef,
      winFlashRef: this.winFlashRef,
      topContentRef: this.topContentRef,
      winMessageRef: this.winMessageRef,
      winAmountRef: this.winAmountRef,
      winTitleRef: this.winTitleRef,
      winLogoRef: this.winLogoRef,
      coinRainRef: this.coinRainRef,
      coinsSoundRef: this.coinsSoundRef,
      reelSpinRef: this.reelSpinRef,
      embersRef: this.embersRef,
      pointerWrapRef: this.pointerWrapRef,
      wheelGroupRef: this.wheelGroupRef,
      grandRowRef: this.grandRowRef,
      pillMajorRef: this.pillMajorRef,
      pillMinorRef: this.pillMinorRef,
      pillMiniRef: this.pillMiniRef,
      onSpin: () => this.spin(),
      onRandomSpin: this.randomSpin,
      countdownRef: this.countdownRef,
      countdownNumRef: this.countdownNumRef,
      preloaderRef: this.preloaderRef,
      preloaderTextRef: this.preloaderTextRef,
      countdownAudioRef: this.countdownAudioRef
    };
  }
}
</script>
</body>
