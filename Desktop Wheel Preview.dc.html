<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body { margin: 0; background: #2b2b2b; }</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 32px; background: #2b2b2b; padding: 40px; box-sizing: border-box;">
  <x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" title="" dark="{{ true }}" leading-icon="{{ false }}" trailing-icon="{{ false }}" hint-size="393px,852px">
    <div style="position: relative; width: 100%; height: 100%; background: #000; overflow: hidden;">
      <dc-import name="Wheel Overlay" hint-size="393px,852px" style="position: absolute; inset: 0;"></dc-import>
    </div>
  </x-import>
  <div style="width: 200px; display: flex; flex-direction: column; gap: 10px; background: #1E1E1E; border: 1px solid #3a3a3a; border-radius: 12px; padding: 16px; box-sizing: border-box;">
    <span style="font-family: Inter, sans-serif; font-weight: 700; font-size: 13px; color: #FFFFFF; letter-spacing: 0.3px; text-transform: uppercase;">Skip to outcome</span>
    <span style="font-family: Inter, sans-serif; font-size: 12px; color: #9a9a9a; line-height: 1.4; margin-bottom: 4px;">Jumps straight to that tier's win screen for design review.</span>
    <sc-for list="{{ tiers }}" as="tier" hint-placeholder-count="5">
      <button onClick="{{ tier.onClick }}" disabled="{{ tier.disabled }}" style="font-family: Inter, sans-serif; font-weight: 600; font-size: 14px; color: {{ tier.textColor }}; background: {{ tier.color }}; border: none; border-radius: 8px; padding: 10px 12px; cursor: pointer; text-align: left; transition: background 150ms ease-out; opacity: {{ tier.opacity }};">{{ tier.label }}</button>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pressed: null };

  jump(key) {
    this.setState({ pressed: key });
    const wheel = window.__jwWheelInstance;
    if (wheel && typeof wheel.jumpToTier === "function") {
      wheel.jumpToTier(key);
    }
  }

  renderVals() {
    const defs = [
      { key: "mega", label: "Mega Jackpot" },
      { key: "major", label: "Major Jackpot" },
      { key: "minor", label: "Minor Jackpot" },
      { key: "mini", label: "Mini Jackpot" }
    ];
    const pressed = this.state.pressed;
    return {
      tiers: defs.map(d => ({
        ...d,
        color: d.key === pressed ? "#FAD749" : "#3a3a3a",
        textColor: d.key === pressed ? "#000000" : "#FFFFFF",
        disabled: false,
        opacity: 1,
        onClick: () => this.jump(d.key)
      }))
    };
  }
}

</script>
</body>
</html>
